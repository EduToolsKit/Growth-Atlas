    <script>
      /* Pre-paint bootstrap: restore persisted language, theme and gender mode
         before first paint to avoid flashes of the wrong theme or direction.
         Must stay in sync with src/services/storage.js (STORAGE_KEY). */
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('growth-atlas.prefs') || '{}');
          var theme = prefs.theme === 'dark' || prefs.theme === 'light'
            ? prefs.theme
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var lang = prefs.language === 'ar' ? 'ar' : 'en';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
          if (prefs.gender === 'female' || prefs.gender === 'male') root.dataset.gender = prefs.gender;
        } catch (e) {
          /* Corrupted storage — fall back to defaults already on the element. */
        }
      })();
    </script>
    <title>Growth Atlas — Infant Growth Reference</title>
